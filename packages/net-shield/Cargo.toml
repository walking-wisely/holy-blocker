[package]
name = "net-shield"
version = "0.1.0"
edition = "2024"

[lib]
name = "net_shield"
path = "src/lib.rs"

[[bin]]
name = "net-shield"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bincode = "1"
domain-blocklist = { path = "../domain-blocklist" }
domain-normalize = { path = "../domain-normalize" }
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
fst = "0.4.7"
memmap2 = "0.9"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11"
thiserror = "2.0.20"
tokio = { version = "1", features = ["full"] }

[target.'cfg(target_os = "windows")'.dependencies]
wintun = "0.5"

[dev-dependencies]
tempfile = "3"
