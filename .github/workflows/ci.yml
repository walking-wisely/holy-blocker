name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: js
    permissions:
      contents: read
    uses: ./.github/workflows/ci-js.yml

  rust:
    name: rust
    permissions:
      contents: read
    uses: ./.github/workflows/ci-rust.yml

  plan:
    name: plan
    permissions:
      contents: read
    uses: ./.github/workflows/ci-plan.yml

  gate:
    name: CI gate
    needs: [js, rust, plan]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job to have succeeded or been skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e '[.[].result] | all(. == "success" or . == "skipped")' > /dev/null
