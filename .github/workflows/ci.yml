name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.ref }}-${{ github.event.action == 'edited' && 'edited' || 'code' }}
  cancel-in-progress: true

jobs:
  js:
    name: js
    if: github.event.action != 'edited'
    permissions:
      contents: read
    uses: ./.github/workflows/ci-js.yml

  rust:
    name: rust
    if: github.event.action != 'edited'
    permissions:
      contents: read
    uses: ./.github/workflows/ci-rust.yml

  mutants:
    name: mutants
    if: github.event.action != 'edited'
    permissions:
      contents: read
    uses: ./.github/workflows/ci-mutants.yml

  plan:
    name: plan
    permissions:
      contents: read
    uses: ./.github/workflows/ci-plan.yml

  platforms:
    name: platforms
    if: github.event.action != 'edited'
    permissions:
      contents: read
    uses: ./.github/workflows/ci-platforms.yml

  gate:
    name: CI gate
    needs: [js, rust, mutants, plan, platforms]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job to have succeeded or been skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e '[.[].result] | all(. == "success" or . == "skipped")' > /dev/null
