name: CI Advisories

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-advisories-${{ github.ref }}
  cancel-in-progress: true

jobs:
  advisories:
    name: ${{ matrix.crate }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        crate:
          - text-policy
          - text-policy-ffi
          - domain-normalize
          - domain-blocklist
          - net-shield
          - net-shield-ffi
          - image-sandbox
          - image-sandbox-ffi
          - mitm-proxy
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install cargo-deny
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2

      - name: Check advisories
        run: cargo deny --manifest-path packages/${{ matrix.crate }}/Cargo.toml --locked --config deny.toml check advisories
