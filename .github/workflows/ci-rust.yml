name: CI Rust

on:
  workflow_call:

jobs:
  changes:
    name: Affected crates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      crates: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Detect affected crates
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            shared: &shared
              - ".github/workflows/ci-rust.yml"
              - "rust-toolchain.toml"
              - "deny.toml"
            text-policy:
              - *shared
              - "packages/text-policy/**"
            text-policy-ffi:
              - *shared
              - "packages/text-policy-ffi/**"
              - "packages/text-policy/**"
            domain-normalize:
              - *shared
              - "packages/domain-normalize/**"
            domain-blocklist:
              - *shared
              - "packages/domain-blocklist/**"
              - "packages/domain-normalize/**"
            net-shield:
              - *shared
              - "packages/net-shield/**"
              - "packages/domain-blocklist/**"
              - "packages/domain-normalize/**"
            net-shield-ffi:
              - *shared
              - "packages/net-shield-ffi/**"
              - "packages/net-shield/**"
              - "packages/domain-blocklist/**"
              - "packages/domain-normalize/**"
            image-sandbox:
              - *shared
              - "packages/image-sandbox/**"
            image-sandbox-ffi:
              - *shared
              - "packages/image-sandbox-ffi/**"
              - "packages/image-sandbox/**"
            mitm-proxy:
              - *shared
              - "packages/mitm-proxy/**"
              - "packages/text-policy/**"
              - "packages/image-sandbox/**"

  rust:
    name: ${{ matrix.crate }}
    needs: changes
    if: needs.changes.outputs.crates != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      FMT_CLEAN: '["text-policy-ffi","domain-normalize","net-shield-ffi","image-sandbox-ffi"]'
    strategy:
      fail-fast: false
      matrix:
        crate: ${{ fromJSON(needs.changes.outputs.crates) }}
        exclude:
          - crate: shared
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: 1.90.0
          components: clippy, rustfmt

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: packages/${{ matrix.crate }}

      - name: Install cargo-deny
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-deny@0.20.2

      - name: Format
        if: contains(fromJSON(env.FMT_CLEAN), matrix.crate)
        working-directory: packages/${{ matrix.crate }}
        run: cargo fmt --check

      - name: Clippy
        working-directory: packages/${{ matrix.crate }}
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        working-directory: packages/${{ matrix.crate }}
        run: cargo test --locked

      - name: Dependency policy
        run: cargo deny --manifest-path packages/${{ matrix.crate }}/Cargo.toml --locked --config deny.toml check

      - name: UniFFI bindings
        if: endsWith(matrix.crate, '-ffi')
        working-directory: packages/${{ matrix.crate }}
        env:
          CRATE: ${{ matrix.crate }}
        run: |
          lib="target/debug/lib${CRATE//-/_}.so"
          cargo build --locked --lib
          test -f "$lib"
          for language in kotlin swift; do
            cargo run --locked --quiet --features bindgen --bin uniffi-bindgen -- \
              generate --library "$lib" --language "$language" --no-format \
              --out-dir "$RUNNER_TEMP/bindings/$CRATE/$language"
          done
          find "$RUNNER_TEMP/bindings/$CRATE" -type f | grep -q .
