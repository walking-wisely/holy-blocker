name: CI Rust

on:
  pull_request:
    paths:
      - ".github/workflows/ci-rust.yml"
      - "packages/text-policy/**"
      - "packages/text-policy-ffi/**"
      - "packages/mitm-proxy/**"
      - "packages/net-shield/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci-rust.yml"
      - "packages/text-policy/**"
      - "packages/text-policy-ffi/**"
      - "packages/mitm-proxy/**"
      - "packages/net-shield/**"

concurrency:
  group: ci-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/text-policy
          - packages/text-policy-ffi
          - packages/mitm-proxy
          - packages/net-shield
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: 1.88.0

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: ${{ matrix.package }}

      - name: Test
        working-directory: ${{ matrix.package }}
        run: cargo test --locked
