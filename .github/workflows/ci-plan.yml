name: CI Plan

on:
  workflow_call:
  workflow_dispatch:

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      plan: ${{ steps.filter.outputs.plan }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Detect plan changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            plan:
              - ".github/workflows/ci-plan.yml"
              - "tools/plan/**"
              - "docs/components/**/steps/*.toml"
              - "docs/components/**/package.toml"
              - "docs/components/**/plan.md"
              - "docs/engineering/steps/*.toml"
              - "docs/engineering/package.toml"
              - "docs/engineering/plan.md"
              - "docs/**"
              - "*.md"
              - ".github/**"
              - "CLAUDE.md"
              - "AGENTS.md"
              - "deny.toml"
              - ".gitleaks.toml"
              - ".pre-commit-config.yaml"
              - ".husky/**"
              - "packages/classifier-head/**"
              - "packages/classifier-head-ffi/**"
              - "apps/desktop/**"
              - "packages/domain-blocklist/**"
              - "packages/domain-normalize/**"
              - "packages/image-sandbox/**"
              - "packages/image-sandbox-ffi/**"
              - "native-modules/mac-daemon/**"
              - "machine-learning/**"
              - "packages/mitm-proxy/**"
              - "apps/mobile/**"
              - "packages/net-shield/**"
              - "packages/net-shield-ffi/**"
              - "packages/text-policy/**"
              - "packages/text-policy-ffi/**"
              - "native-modules/win-daemon/**"
              - "native-modules/win-network/**"
              - "tools/plan/**"
              - ".claude/skills/**"

  plan-ledger:
    name: Plan ledger
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.plan == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Test ledger tools
        run: python -m unittest discover -s tools/plan/tests -t .

      - name: Validate step manifests
        run: python -m tools.plan.ledger validate docs/components/*/ docs/engineering

      - name: Lint docs navigation (links, anchors, component indexes)
        run: python -m tools.plan.doclint

  loop-contract:
    name: Loop contract
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Check the PR carries the loop's artifacts
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          python -m tools.plan.loop check \
            --body-file "$RUNNER_TEMP/pr-body.md" \
            --base "$BASE_SHA" --head "$HEAD_SHA"

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
