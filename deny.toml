[graph]
all-features = false

[advisories]
unmaintained = "workspace"
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 is declared complete by its authors and has no vulnerability; no drop-in replacement is planned" },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

confidence-threshold = 0.9
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
