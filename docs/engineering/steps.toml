# Thin step ledger for the engineering harness. Source of truth for whether each
# build step exists.
#
#   python -m tools.plan.ledger validate docs/engineering
#   python -m tools.plan.ledger render   docs/engineering
#
# Statuses: `pending` — not settled. `at-pr` — settled through every gate, branch
# open at a PR, not yet on master. `done` — the step's implementation exists on
# master; it does NOT mean the route is covered, verification lives in
# docs/engineering/coverage.md, never here.
#
# Do not put narrative here. Gotchas and wrong-constant war stories live in
# plan.md. `evidence` is one line pointing at where the step landed (commit, PR, or
# the plan's own wording), not an argument.

paths = ["tools/plan", ".claude/skills"]

[[step]]
id = "engineering.ledger-coverage"
title = "ledger coverage — a steps.toml and plan markers for every component"
status = "done"
evidence = "13 new docs/components/*/steps.toml + tools/plan/tests/test_manifests.py on branch infra/ledger-coverage (commit 68e836a); lands on master at merge of this PR"
acceptance = "code"
verify = "python -m unittest discover -s tools/plan/tests -t . && python -m tools.plan.ledger validate docs/components/*/ docs/engineering"

[[step]]
id = "engineering.loop-enforcement"
title = "loop enforcement — a trigger rule and a machine-checked PR contract"
status = "done"
evidence = "tools/plan/loop.py (check, open), manifest `paths`, ci-plan loop-contract job; branch infra/loop-enforcement"
acceptance = "code"
depends_on = ["engineering.ledger-coverage"]
verify = "python -m unittest discover -s tools/plan/tests -t ."

