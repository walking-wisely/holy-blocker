# Thin step ledger for mobile. Source of truth for whether each build step exists.
#
#   python -m tools.plan.ledger validate docs/components/mobile
#   python -m tools.plan.ledger render   docs/components/mobile
#
# `done` means the step's implementation exists on master. It does NOT mean the
# route is covered: live and observational verification lives in
# docs/engineering/coverage.md, never here.
#
# Do not put narrative here. Gotchas, wrong-constant war stories, and "measured
# wrong in module N" notes live in plan.md. `evidence` is one line pointing at
# where the step landed (commit, PR, or the plan's own wording), not an argument.
#
# Steps are the plan's `## Implementation order`, items 1-14, in the plan's own
# order. Recents (item 8) and the Xiaomi/OEM profiles are deferred on hardware
# and are recorded as pending work in plan.md rather than as steps.

