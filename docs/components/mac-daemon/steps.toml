# Thin step ledger for mac-daemon. Source of truth for whether each build step exists.
#
#   python -m tools.plan.ledger validate docs/components/mac-daemon
#   python -m tools.plan.ledger render   docs/components/mac-daemon
#
# `done` means the step's implementation exists on master. It does NOT mean the
# route is covered: live and observational verification lives in
# docs/engineering/coverage.md, never here. Module 7/8/10 are `done` as code with
# their live observations still outstanding; coverage.md tracks the difference.
#
# Do not put narrative here. Gotchas, wrong-constant war stories, and "measured
# wrong in module N" notes live in plan.md. `evidence` is one line pointing at
# where the step landed (commit, PR, or the plan's own wording), not an argument.
#
# Steps are the plan's numbered module headings, in the plan's own order: Layer 1
# modules 1-6, then Layer 2 module 0 and modules 7-16. The Layer 1 package
# scaffold and the last three sessions of the first live e2e pass are included
# because they are plan steps with no module heading of their own.

